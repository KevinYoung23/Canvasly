name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-14
            artifact: desktop-macos
            command: npm run desktop:dist:mac
          - name: Windows x64
            os: windows-latest
            artifact: desktop-windows
            command: npm run desktop:dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Verify release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            node -e "const expected=process.env.GITHUB_REF_NAME.replace(/^v/,''); const actual=require('./package.json').version; if(actual!==expected){throw new Error('package.json version '+actual+' does not match tag '+expected)}"
          fi
      - run: npm ci
      - name: Lint and desktop runtime tests
        run: |
          npm run lint
          npm run test:desktop
      - name: Desktop restart persistence test
        if: matrix.os == 'macos-14'
        run: npm run test:desktop-app
      - name: Build desktop installers
        run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ matrix.os == 'macos-14' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-14' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.yml
            release/*.blockmap

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets
      - name: Create release and upload update files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          release_flags=()
          if [[ "$TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "Canvasly $TAG" "${release_flags[@]}"
          fi
          gh release upload "$TAG" release-assets/* --clobber
